name: GitHub-Profile-Summary-Cards

on:
    schedule:
        - cron: '20 * * * *'
    workflow_dispatch:
    push:
        branches:
            - main

concurrency:
    group: profile-readme-push
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        name: generate

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: true

            - name: Generate Profile Summary Cards
              uses: vn7n24fzkq/github-profile-summary-cards@974577f1823715ca047e9976548634816a3a0264
              env:
                  GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
              with:
                  USERNAME: ${{ github.repository_owner }}
                  BRANCH_NAME: main
                  UTC_OFFSET: 9
                  AUTO_PUSH: false

            - name: Commit and Push
              shell: bash
              run: |
                  set -e

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add -A -- profile-summary-card-output

                  if git diff --cached --quiet; then
                      echo "No changes to commit."
                      exit 0
                  fi

                  git commit -m "Update profile summary cards"

                  git pull --rebase origin main
                  git push origin HEAD:main

                  echo "Profile summary cards updated successfully."
